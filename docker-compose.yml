services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aigovernance
      POSTGRES_USER: aigovuser
      POSTGRES_PASSWORD: aigovpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigovuser -d aigovernance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI Governance Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8801:8000"
    environment:
      DATABASE_URL: postgresql://aigovuser:aigovpass@db:5432/aigovernance

      # Azure OpenAI — override via .env or shell environment
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-02-01}

      # Optional overrides
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SCHEDULER_MAX_WORKERS: ${SCHEDULER_MAX_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Alert / anomaly thresholds (all have defaults in config.py)
      ALERT_BUDGET_DEFAULT_THRESHOLD_PCT: ${ALERT_BUDGET_DEFAULT_THRESHOLD_PCT:-80}
      ANOMALY_SPIKE_RATIO: ${ANOMALY_SPIKE_RATIO:-1.8}

      # Licensed/packaged per-client deployments only (see LICENSING_PACKAGING.md).
      # Off by default: the shared platform deployment never sets this and the
      # ./license mount below stays empty and unused.
      LICENSE_ENFORCEMENT_ENABLED: ${LICENSE_ENFORCEMENT_ENABLED:-false}
      LICENSE_CHECK_INTERVAL_SECONDS: ${LICENSE_CHECK_INTERVAL_SECONDS:-3600}
      LICENSE_RENEWAL_WARNING_DAYS: ${LICENSE_RENEWAL_WARNING_DAYS:-15}

      # Admin bootstrap key — required for POST /license/upload to be callable
      # at all on a fresh deployment (no per-org API keys exist yet). Set per
      # deployment in .env; never commit a real value.
      GOVERNANCE_MASTER_KEY: ${GOVERNANCE_MASTER_KEY:-}
    volumes:
      # Per-client license material lives here, outside the image, so the
      # same built image works for every client — see LICENSING_PACKAGING.md.
      - ./license:/app/license
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
